<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Zet je opties in een rad, draai, en laat het eerlijk beslissen. Met gewichten, teams, geschiedenis en deelbare links." />
    <meta name="theme-color" content="#FFF7EC" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>SpinDecide</title>
    <script>
      // Apply the saved theme before first paint to avoid a flash.
      try {
        var t = (JSON.parse(localStorage.getItem('spindecide-settings') || '{}').state || {}).theme || 'system';
        if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
